name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布 GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (Get-Content "app_version.txt" -Raw).Trim()
          if (-not $version) {
            throw "app_version.txt is empty."
          }
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) {
            throw "Tag must start with v, current: $tag"
          }
          $tagVersion = $tag.Substring(1)
          if ($tagVersion -ne $version) {
            throw "Tag version ($tagVersion) does not match app_version.txt ($version)."
          }
          Write-Host "Tag and app version validated: $tagVersion"

      - name: Prepare app config
        shell: pwsh
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if ($env:APP_CONFIG_JSON) {
            Set-Content -Path "app_config.json" -Value $env:APP_CONFIG_JSON -Encoding UTF8
            Write-Host "app_config.json prepared from APP_CONFIG_JSON secret."
          }
          if (-not (Test-Path "app_config.json")) {
            throw "app_config.json is missing. Please set repository secret APP_CONFIG_JSON."
          }

      - name: Build Windows installer and manifest
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
            pwsh -ExecutionPolicy Bypass -File ".\scripts\build_windows_installer.ps1" -BaseUrl $baseUrl
          } else {
            pwsh -ExecutionPolicy Bypass -File ".\scripts\build_windows_installer.ps1" -SkipManifest
          }

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ github.ref_name || github.sha }}
          path: |
            release/*.exe
            release/*.zip
            release/latest.json
          if-no-files-found: ignore

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/latest.json
          fail_on_unmatched_files: true
