name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要构建的版本标签，例如 v1.0.18"
        required: true
        type: string
      publish_oss:
        description: "是否同步发布到 OSS"
        required: false
        default: false
        type: boolean
      publish_oss_only:
        description: "是否只把现有 Release 资产同步到 OSS，不重新构建"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-build-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      oss_prefix: ${{ steps.meta.outputs.oss_prefix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Validate release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG_NAME}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v.+$ ]]; then
            echo "Release tag must start with v, current: $tag" >&2
            exit 1
          fi
          git rev-parse "$tag^{commit}" >/dev/null

          version="$(tr -d '\r\n' < app_version.txt)"
          if [ -z "$version" ]; then
            echo "app_version.txt is empty." >&2
            exit 1
          fi
          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag version ($tag_version) does not match app_version.txt ($version)." >&2
            exit 1
          fi

          oss_prefix="${OSS_PREFIX:-ai-boss}"
          oss_prefix="${oss_prefix#/}"
          oss_prefix="${oss_prefix%/}"

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "oss_prefix=$oss_prefix" >> "$GITHUB_OUTPUT"

  ensure-release:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Ensure GitHub release exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes ""
          fi

  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.publish_oss_only == 'true') }}
    needs:
      - prepare
      - ensure-release
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      GITEE_RELEASE_BASE_URL: ${{ secrets.GITEE_RELEASE_BASE_URL }}
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_BUCKET_NAME: mova-itai
      OSS_PUBLIC_BASE_URL: https://mova-itai.oss-cn-shanghai.aliyuncs.com/ai-boss
      OSS_PREFIX: ai-boss
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare optional app config
        shell: pwsh
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if ($env:APP_CONFIG_JSON) {
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText((Join-Path $PWD "app_config.json"), $env:APP_CONFIG_JSON, $utf8NoBom)
            Write-Host "app_config.json prepared from APP_CONFIG_JSON."
          } else {
            Write-Host "APP_CONFIG_JSON not set. Build will continue without injected runtime config."
          }

      - name: Resolve release base URL
        shell: pwsh
        run: |
          $ossPrefix = if ($env:OSS_PREFIX) { $env:OSS_PREFIX } else { "ai-boss" }
          $ossPrefix = $ossPrefix.Trim("/")

          $ossPublicBaseUrl = $env:OSS_PUBLIC_BASE_URL.TrimEnd("/")
          if (-not $ossPublicBaseUrl -and $env:OSS_BUCKET_NAME -and $env:OSS_ENDPOINT) {
            $ossEndpoint = $env:OSS_ENDPOINT -replace '^https?://', ''
            $ossEndpoint = $ossEndpoint.TrimEnd("/")
            $ossPublicBaseUrl = "https://$($env:OSS_BUCKET_NAME).$ossEndpoint"
            if ($ossPrefix) {
              $ossPublicBaseUrl = "$ossPublicBaseUrl/$ossPrefix"
            }
          }

          $releaseBaseUrl = $ossPublicBaseUrl
          if (-not $releaseBaseUrl -and $env:GITEE_RELEASE_BASE_URL) {
            $releaseBaseUrl = $env:GITEE_RELEASE_BASE_URL.TrimEnd("/")
          }

          "RELEASE_BASE_URL=$releaseBaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($releaseBaseUrl) {
            Write-Host "Resolved release base URL: $releaseBaseUrl"
          } else {
            Write-Host "No release base URL configured. Build will skip manifest generation."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          if ($env:RELEASE_BASE_URL) {
            $baseUrl = "$env:RELEASE_BASE_URL/releases/$env:RELEASE_VERSION"
            pwsh -ExecutionPolicy Bypass -File ".\scripts\build_windows_installer.ps1" -BaseUrl $baseUrl
          } else {
            pwsh -ExecutionPolicy Bypass -File ".\scripts\build_windows_installer.ps1" -SkipManifest
          }

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Name -match '\.(exe|zip)$' -or $_.Name -eq 'latest.json'
          } | ForEach-Object { $_.FullName }
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows release files found."
          }
          gh release upload $env:RELEASE_TAG $files --repo $env:GITHUB_REPOSITORY --clobber

  build-macos:
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.publish_oss_only == 'true') }}
    needs:
      - prepare
      - ensure-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            python_arch: arm64
            artifact_suffix: ""
            skip_manifest: "0"
          - runner: macos-15-intel
            python_arch: x64
            artifact_suffix: "-x64"
            skip_manifest: "1"
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      GITEE_RELEASE_BASE_URL: ${{ secrets.GITEE_RELEASE_BASE_URL }}
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_BUCKET_NAME: mova-itai
      OSS_PUBLIC_BASE_URL: https://mova-itai.oss-cn-shanghai.aliyuncs.com/ai-boss
      OSS_PREFIX: ai-boss
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Prepare optional app config
        shell: bash
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "${APP_CONFIG_JSON:-}" ]; then
            printf '%s' "$APP_CONFIG_JSON" > app_config.json
            echo "app_config.json prepared from APP_CONFIG_JSON."
          else
            echo "APP_CONFIG_JSON not set. Build will continue without injected runtime config."
          fi

      - name: Resolve release base URL
        shell: bash
        run: |
          oss_prefix="${OSS_PREFIX:-ai-boss}"
          oss_prefix="${oss_prefix#/}"
          oss_prefix="${oss_prefix%/}"

          oss_public_base_url="${OSS_PUBLIC_BASE_URL%/}"
          if [ -z "$oss_public_base_url" ] && [ -n "${OSS_BUCKET_NAME:-}" ] && [ -n "${OSS_ENDPOINT:-}" ]; then
            oss_endpoint="${OSS_ENDPOINT#http://}"
            oss_endpoint="${oss_endpoint#https://}"
            oss_endpoint="${oss_endpoint%/}"
            oss_public_base_url="https://${OSS_BUCKET_NAME}.${oss_endpoint}"
            if [ -n "$oss_prefix" ]; then
              oss_public_base_url="${oss_public_base_url}/${oss_prefix}"
            fi
          fi

          release_base_url="${oss_public_base_url:-${GITEE_RELEASE_BASE_URL%/}}"
          echo "RELEASE_BASE_URL=$release_base_url" >> "$GITHUB_ENV"
          if [ -n "$release_base_url" ]; then
            echo "Resolved release base URL: $release_base_url"
          else
            echo "No release base URL configured. Build will skip manifest generation."
          fi

      - name: Build unsigned macOS bundle
        shell: bash
        run: |
          chmod +x ./scripts/build_macos_bundle.sh
          args=()
          if [ -n "$RELEASE_BASE_URL" ] && [ "${{ matrix.skip_manifest }}" != "1" ]; then
            args+=(--base-url "$RELEASE_BASE_URL/releases/$RELEASE_VERSION")
          else
            args+=(--skip-manifest)
          fi
          if [ -n "${{ matrix.artifact_suffix }}" ]; then
            args+=(--artifact-suffix "${{ matrix.artifact_suffix }}")
          fi
          ./scripts/build_macos_bundle.sh "${args[@]}"

      - name: Upload macOS assets to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(release/*.zip release/*.dmg release/latest-macos*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No macOS release files found." >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publish-oss:
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        github.event.inputs.publish_oss == 'true' &&
        needs.prepare.result == 'success' &&
        needs.ensure-release.result == 'success' &&
        (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') &&
        (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
      }}
    needs:
      - prepare
      - ensure-release
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      OSS_ENDPOINT: oss-cn-shanghai.aliyuncs.com
      OSS_BUCKET_NAME: mova-itai
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      OSS_PUBLIC_BASE_URL: https://mova-itai.oss-cn-shanghai.aliyuncs.com/ai-boss
      OSS_PREFIX: ai-boss
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.release_tag }}

      - name: Resolve publish config
        id: publish_meta
        shell: bash
        run: |
          missing=()
          for name in OSS_ENDPOINT OSS_BUCKET_NAME OSS_ACCESS_KEY_ID OSS_ACCESS_KEY_SECRET; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Missing OSS config: ${missing[*]}. Skip OSS publish."
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Resolved OSS publish target: ${OSS_PUBLIC_BASE_URL:-https://${OSS_BUCKET_NAME}.${OSS_ENDPOINT}}"

      - name: Setup Python
        if: ${{ steps.publish_meta.outputs.skip != 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OSS SDK
        if: ${{ steps.publish_meta.outputs.skip != 'true' }}
        run: python -m pip install --upgrade oss2

      - name: Download release assets
        if: ${{ steps.publish_meta.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-artifacts
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-artifacts \
            -p 'AIBossWorkbench-*' \
            -p 'latest*.json'

      - name: Upload release to OSS
        if: ${{ steps.publish_meta.outputs.skip != 'true' }}
        run: |
          python scripts/upload_release_to_oss.py \
            --source-dir release-artifacts \
            --version "$RELEASE_VERSION"
