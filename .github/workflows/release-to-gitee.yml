name: Release Build Artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "要构建的版本标签，例如 v1.0.18"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      release_base_url: ${{ steps.meta.outputs.release_base_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || github.ref }}

      - name: Validate release tag
        id: meta
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          GITEE_RELEASE_BASE_URL: ${{ secrets.GITEE_RELEASE_BASE_URL }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG_NAME}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v.+$ ]]; then
            echo "Release tag must start with v, current: $tag" >&2
            exit 1
          fi
          git rev-parse "$tag^{commit}" >/dev/null

          version="$(tr -d '\r\n' < app_version.txt)"
          if [ -z "$version" ]; then
            echo "app_version.txt is empty." >&2
            exit 1
          fi
          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag version ($tag_version) does not match app_version.txt ($version)." >&2
            exit 1
          fi

          release_base_url="${GITEE_RELEASE_BASE_URL%/}"
          if [ -z "$release_base_url" ]; then
            release_base_url="https://link-wei.gitee.io/ai-boss"
          fi

          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "release_base_url=$release_base_url" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      RELEASE_BASE_URL: ${{ needs.prepare.outputs.release_base_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare optional app config
        shell: pwsh
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if ($env:APP_CONFIG_JSON) {
            $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText((Join-Path $PWD "app_config.json"), $env:APP_CONFIG_JSON, $utf8NoBom)
            Write-Host "app_config.json prepared from APP_CONFIG_JSON."
          } else {
            Write-Host "APP_CONFIG_JSON not set. Build will continue without injected runtime config."
          }

      - name: Build Windows installer and manifest
        shell: pwsh
        run: |
          $baseUrl = "$env:RELEASE_BASE_URL/releases/$env:RELEASE_VERSION"
          pwsh -ExecutionPolicy Bypass -File ".\scripts\build_windows_installer.ps1" -BaseUrl $baseUrl

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-${{ env.RELEASE_VERSION }}
          path: |
            release/*.exe
            release/*.zip
            release/latest.json
          if-no-files-found: error
          compression-level: 0

  build-macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            python_arch: arm64
            artifact_suffix: ""
            skip_manifest: "0"
          - runner: macos-15-intel
            python_arch: x64
            artifact_suffix: "-x64"
            skip_manifest: "1"
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      RELEASE_BASE_URL: ${{ needs.prepare.outputs.release_base_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Prepare optional app config
        shell: bash
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "${APP_CONFIG_JSON:-}" ]; then
            printf '%s' "$APP_CONFIG_JSON" > app_config.json
            echo "app_config.json prepared from APP_CONFIG_JSON."
          else
            echo "APP_CONFIG_JSON not set. Build will continue without injected runtime config."
          fi

      - name: Build unsigned macOS bundle and manifest
        shell: bash
        run: |
          chmod +x ./scripts/build_macos_bundle.sh
          args=(
            --base-url "$RELEASE_BASE_URL/releases/$RELEASE_VERSION"
          )
          if [ -n "${{ matrix.artifact_suffix }}" ]; then
            args+=(--artifact-suffix "${{ matrix.artifact_suffix }}")
          fi
          if [ "${{ matrix.skip_manifest }}" = "1" ]; then
            args+=(--skip-manifest)
          fi
          ./scripts/build_macos_bundle.sh "${args[@]}"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.python_arch }}-${{ env.RELEASE_VERSION }}
          path: |
            release/*.zip
            release/*.dmg
            release/latest-macos*.json
          if-no-files-found: error
          compression-level: 0
