name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布 GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            python_arch: arm64
            target_arch: arm64
            artifact_suffix: ""
            skip_manifest: "0"
          - runner: macos-13
            python_arch: x64
            target_arch: x86_64
            artifact_suffix: "-x64"
            skip_manifest: "1"
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.python_arch }}

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          version="$(tr -d '\r\n' < app_version.txt)"
          if [ -z "$version" ]; then
            echo "app_version.txt is empty." >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Tag must start with v, current: $tag" >&2
            exit 1
          fi
          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag version ($tag_version) does not match app_version.txt ($version)." >&2
            exit 1
          fi
          echo "Tag and app version validated: $tag_version"

      - name: Prepare app config
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "${APP_CONFIG_JSON:-}" ]; then
            printf '%s' "$APP_CONFIG_JSON" > app_config.json
            echo "app_config.json prepared from APP_CONFIG_JSON secret."
          fi
          if [ ! -f app_config.json ]; then
            echo "app_config.json is missing. Please set repository secret APP_CONFIG_JSON." >&2
            exit 1
          fi

      - name: Validate macOS signing secrets
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          required=(
            MACOS_CERTIFICATE_P12_BASE64
            MACOS_CERTIFICATE_PASSWORD
            MACOS_CODESIGN_IDENTITY
            MACOS_NOTARY_APPLE_ID
            MACOS_NOTARY_PASSWORD
            MACOS_NOTARY_TEAM_ID
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing secret: $key" >&2
              exit 1
            fi
          done

      - name: Setup macOS signing keychain
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/codesign.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          CERT_PATH="$RUNNER_TEMP/codesign.p12"
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"')"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build macOS bundle and manifest
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          chmod +x ./scripts/build_macos_bundle.sh
          args=(
            --target-arch "${{ matrix.target_arch }}"
            --codesign-identity "$MACOS_CODESIGN_IDENTITY"
            --entitlements "scripts/macos.entitlements"
            --notary-apple-id "$MACOS_NOTARY_APPLE_ID"
            --notary-password "$MACOS_NOTARY_PASSWORD"
            --notary-team-id "$MACOS_NOTARY_TEAM_ID"
          )
          if [ -n "${{ matrix.artifact_suffix }}" ]; then
            args+=(--artifact-suffix "${{ matrix.artifact_suffix }}")
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            base_url="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
            args+=(--base-url "$base_url")
            if [ "${{ matrix.skip_manifest }}" = "1" ]; then
              args+=(--skip-manifest)
            fi
          else
            args+=(--skip-manifest)
          fi
          ./scripts/build_macos_bundle.sh "${args[@]}"

      - name: Cleanup macOS signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "${KEYCHAIN_PATH}" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ matrix.target_arch }}-${{ github.run_id }}
          path: |
            release/*.zip
            release/*.dmg
            release/latest-macos*.json
          if-no-files-found: ignore

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            release/*.zip
            release/*.dmg
            release/latest-macos*.json
          fail_on_unmatched_files: true
