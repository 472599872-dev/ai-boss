name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布 GitHub Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate tag matches app version
        if: github.event_name == 'push'
        run: |
          version="$(tr -d '\r\n' < app_version.txt)"
          if [ -z "$version" ]; then
            echo "app_version.txt is empty." >&2
            exit 1
          fi
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then
            echo "Tag must start with v, current: $tag" >&2
            exit 1
          fi
          tag_version="${tag#v}"
          if [ "$tag_version" != "$version" ]; then
            echo "Tag version ($tag_version) does not match app_version.txt ($version)." >&2
            exit 1
          fi
          echo "Tag and app version validated: $tag_version"

      - name: Prepare app config
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          if [ -n "${APP_CONFIG_JSON:-}" ]; then
            printf '%s' "$APP_CONFIG_JSON" > app_config.json
            echo "app_config.json prepared from APP_CONFIG_JSON secret."
          fi
          if [ ! -f app_config.json ]; then
            echo "app_config.json is missing. Please set repository secret APP_CONFIG_JSON." >&2
            exit 1
          fi

      - name: Build macOS bundle and manifest
        env:
          RELEASE_BASE_URL: ${{ vars.RELEASE_BASE_URL }}
          RELEASE_BASE_URL_SECRET: ${{ secrets.RELEASE_BASE_URL }}
        run: |
          chmod +x ./scripts/build_macos_bundle.sh
          base_url="${RELEASE_BASE_URL:-}"
          if [ -z "$base_url" ]; then
            base_url="${RELEASE_BASE_URL_SECRET:-}"
          fi
          if [ -n "$base_url" ]; then
            ./scripts/build_macos_bundle.sh --base-url "$base_url"
          else
            echo "RELEASE_BASE_URL is empty. Build will skip manifest generation to avoid binding clients to the source repository."
            ./scripts/build_macos_bundle.sh --skip-manifest
          fi

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-${{ github.run_id }}
          path: |
            release/*.zip
            release/*.dmg
            release/latest-macos.json
          if-no-files-found: ignore

      - name: Publish GitHub Release assets
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            release/*.zip
            release/*.dmg
            release/latest-macos.json
          fail_on_unmatched_files: false
